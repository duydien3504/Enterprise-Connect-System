name: API Gateway DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'EnterpriseConnect.ApiGateway/**'
      - '.github/workflows/api-gateway-devsecops.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'EnterpriseConnect.ApiGateway/**'
  workflow_dispatch:

concurrency:
  group: api-gateway-production
  cancel-in-progress: true

jobs:
  security-and-build:
    name: DevSecOps Security Scan & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Secret Scanning (TruffleHog)
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --exclude-paths=.trufflehogignore

      # 2. Setup .NET 8 SDK
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. SCA - NuGet Vulnerability Check
      - name: SCA NuGet Vulnerability Audit
        run: |
          echo ">>> Scanning NuGet dependencies for known CVE vulnerabilities..."
          dotnet list EnterpriseConnect.ApiGateway/EnterpriseConnect.ApiGateway.csproj package --vulnerable --include-transitive

      # 4. Compile & Test
      - name: Build API Gateway
        run: dotnet build EnterpriseConnect.ApiGateway/EnterpriseConnect.ApiGateway.csproj -c Release

      # 5. Build Hardened Docker Container
      - name: Build Docker Image
        run: |
          docker build -f EnterpriseConnect.ApiGateway/Dockerfile -t enterpriseconnect-gateway:${{ github.sha }} .

      # 6. Container Image Security Scan (Aqua Trivy)
      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'enterpriseconnect-gateway:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-to-ec2:
    name: Continuous Deployment to AWS EC2
    needs: security-and-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate SSH Key Secret
        run: |
          if [ -z "$SSH_KEY_VAL" ]; then
            echo "::error::Secret 'AWS_ENTERPRISE_CONNECTION_SECRET' hoặc 'EC2_SSH_KEY' chưa được cấu hình trong GitHub Secrets!"
            exit 1
          fi
          echo "SSH Key secret is detected. Length: ${#SSH_KEY_VAL} characters."
          HEADER=$(echo "$SSH_KEY_VAL" | head -n 1)
          if [[ "$HEADER" != *"BEGIN"* ]]; then
            echo "::error::Khóa SSH phải bắt đầu bằng '-----BEGIN ... PRIVATE KEY-----'. Hãy kiểm tra lại ô Secret chỉ dán duy nhất nội dung file .pem, không dán kèm tên biến!"
            exit 1
          fi
        env:
          SSH_KEY_VAL: ${{ secrets.AWS_ENTERPRISE_CONNECTION_SECRET || secrets.EC2_SSH_KEY }}

      - name: Deploy to AWS EC2 via Direct SSH & SCP
        env:
          SSH_KEY: ${{ secrets.AWS_ENTERPRISE_CONNECTION_SECRET || secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST || '13.238.207.194' }}
          EC2_USER: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SHARED_SECRET || 'REDACTED_GATEWAY_SECRET' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'REDACTED_JWT_SECRET' }}
        run: |
          echo ">>> [1/5] Setting up secure SSH key..."
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo ">>> [2/5] Packaging API Gateway source code (Zero-Git on EC2)..."
          tar --exclude='.git' --exclude='bin' --exclude='obj' --exclude='node_modules' -czf /tmp/gateway.tar.gz \
            EnterpriseConnect.ApiGateway \
            BuildingBlocks 2>/dev/null || tar --exclude='.git' -czf /tmp/gateway.tar.gz EnterpriseConnect.ApiGateway

          echo ">>> [3/5] Generating protected .env configuration..."
          cat << 'ENV_EOF' > /tmp/gateway.env
ASPNETCORE_ENVIRONMENT=Production
ASPNETCORE_HTTP_PORTS=8080
GATEWAY_SHARED_SECRET=${{ secrets.GATEWAY_SHARED_SECRET || 'REDACTED_GATEWAY_SECRET' }}
Security__GatewaySharedSecret=${{ secrets.GATEWAY_SHARED_SECRET || 'REDACTED_GATEWAY_SECRET' }}
JwtSettings__Secret=${{ secrets.JWT_SECRET || 'REDACTED_JWT_SECRET' }}
ENV_EOF

          echo ">>> [4/5] Transferring files directly to EC2 via SCP..."
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key /tmp/gateway.tar.gz ${EC2_USER}@${EC2_HOST}:/tmp/gateway.tar.gz
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key /tmp/gateway.env ${EC2_USER}@${EC2_HOST}:/tmp/gateway.env

          echo ">>> [5/5] Executing deployment and smoke test on EC2..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${EC2_USER}@${EC2_HOST} bash -s << 'REMOTE_EOF'
            set -euo pipefail

            echo ">>> Extracting source files into /opt/enterpriseconnect..."
            sudo mkdir -p /opt/enterpriseconnect
            sudo tar -xzf /tmp/gateway.tar.gz -C /opt/enterpriseconnect
            rm -f /tmp/gateway.tar.gz

            echo ">>> Deploying protected .env file..."
            sudo mkdir -p /opt/enterpriseconnect/gateway
            sudo mv /tmp/gateway.env /opt/enterpriseconnect/gateway/.env
            sudo chmod 600 /opt/enterpriseconnect/gateway/.env

            echo ">>> Building API Gateway Docker image..."
            cd /opt/enterpriseconnect
            sudo docker build -f EnterpriseConnect.ApiGateway/Dockerfile -t enterpriseconnect-gateway:latest .

            echo ">>> Restarting container (bound to 127.0.0.1:8080 behind Nginx)..."
            sudo docker stop enterpriseconnect-api-gateway 2>/dev/null || true
            sudo docker rm enterpriseconnect-api-gateway 2>/dev/null || true
            sudo docker run -d \
              --name enterpriseconnect-api-gateway \
              --restart unless-stopped \
              -p 127.0.0.1:8080:8080 \
              --env-file /opt/enterpriseconnect/gateway/.env \
              enterpriseconnect-gateway:latest

            sleep 5
            echo ">>> Running Smoke Test verification on Gateway..."
            curl -f -s http://127.0.0.1:8080/health/live || exit 1
            echo ">>> Verifying Downstream Reverse Proxy Routing to 5 Microservices..."
            echo "1. Identity Service: $(curl -s http://127.0.0.1:8080/identity/health/live | cut -c 1-60)..."
            echo "2. Messaging Service: $(curl -s http://127.0.0.1:8080/messaging/health/live | cut -c 1-60)..."
            echo "3. Media Service: $(curl -s http://127.0.0.1:8080/media/health/live | cut -c 1-60)..."
            echo "4. Remote Service: $(curl -s http://127.0.0.1:8080/remote/health/live | cut -c 1-60)..."
            echo "5. Admin Service: $(curl -s http://127.0.0.1:8080/admin/health/live | cut -c 1-60)..."
            echo "Deployment to AWS EC2 and End-to-End Routing completed successfully!"
          REMOTE_EOF
