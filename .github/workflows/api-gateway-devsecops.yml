name: API Gateway DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'EnterpriseConnect.ApiGateway/**'
      - '.github/workflows/api-gateway-devsecops.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'EnterpriseConnect.ApiGateway/**'
  workflow_dispatch:

concurrency:
  group: api-gateway-production
  cancel-in-progress: true

jobs:
  security-and-build:
    name: DevSecOps Security Scan & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Secret Scanning (TruffleHog)
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --exclude-paths=.trufflehogignore

      # 2. Setup .NET 8 SDK
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. SCA - NuGet Vulnerability Check
      - name: SCA NuGet Vulnerability Audit
        run: |
          echo ">>> Scanning NuGet dependencies for known CVE vulnerabilities..."
          dotnet list EnterpriseConnect.ApiGateway/EnterpriseConnect.ApiGateway.csproj package --vulnerable --include-transitive

      # 4. Compile & Test
      - name: Build API Gateway
        run: dotnet build EnterpriseConnect.ApiGateway/EnterpriseConnect.ApiGateway.csproj -c Release

      # 5. Build Hardened Docker Container
      - name: Build Docker Image
        run: |
          docker build -f EnterpriseConnect.ApiGateway/Dockerfile -t enterpriseconnect-gateway:${{ github.sha }} .

      # 6. Container Image Security Scan (Aqua Trivy)
      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'enterpriseconnect-gateway:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-to-ec2:
    name: Continuous Deployment to AWS EC2
    needs: security-and-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate SSH Key Secret
        run: |
          if [ -z "$SSH_KEY_VAL" ]; then
            echo "::error::Secret 'AWS_ENTERPRISE_CONNECTION_SECRET' hoặc 'EC2_SSH_KEY' chưa được cấu hình trong GitHub Secrets!"
            exit 1
          fi
          echo "SSH Key secret is detected. Length: ${#SSH_KEY_VAL} characters."
          HEADER=$(echo "$SSH_KEY_VAL" | head -n 1)
          if [[ "$HEADER" != *"BEGIN"* ]]; then
            echo "::error::Khóa SSH phải bắt đầu bằng '-----BEGIN ... PRIVATE KEY-----'. Hãy kiểm tra lại ô Secret chỉ dán duy nhất nội dung file .pem, không dán kèm tên biến!"
            exit 1
          fi
        env:
          SSH_KEY_VAL: ${{ secrets.AWS_ENTERPRISE_CONNECTION_SECRET || secrets.EC2_SSH_KEY }}

      - name: Deploy to AWS EC2 via Direct SSH & SCP
        env:
          SSH_KEY: ${{ secrets.AWS_ENTERPRISE_CONNECTION_SECRET || secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST || '13.238.207.194' }}
          EC2_USER: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SHARED_SECRET || 'REDACTED_GATEWAY_SECRET' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'REDACTED_JWT_SECRET' }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15"
          trap 'rm -f "$HOME/.ssh/deploy_key" /tmp/gateway.env /tmp/gateway.tar.gz' EXIT

          echo ">>> [1/5] Setting up secure SSH key..."
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo ">>> [2/5] Packaging API Gateway source (Dockerfile only needs this folder)..."
          tar --exclude='bin' --exclude='obj' -czf /tmp/gateway.tar.gz EnterpriseConnect.ApiGateway
          ls -lh /tmp/gateway.tar.gz

          echo ">>> [3/5] Generating .env from step env vars (no secrets inlined in script)..."
          umask 077
          {
            printf '%s\n' "ASPNETCORE_ENVIRONMENT=Production"
            printf '%s\n' "ASPNETCORE_HTTP_PORTS=8080"
            printf '%s\n' "GATEWAY_SHARED_SECRET=${GATEWAY_SECRET}"
            printf '%s\n' "Security__GatewaySharedSecret=${GATEWAY_SECRET}"
            printf '%s\n' "JwtSettings__Secret=${JWT_SECRET}"
          } > /tmp/gateway.env

          echo ">>> [4/5] Transferring package to EC2 via SCP..."
          scp $SSH_OPTS /tmp/gateway.tar.gz /tmp/gateway.env "${EC2_USER}@${EC2_HOST}:/tmp/"

          echo ">>> [5/5] Building & restarting Gateway on EC2..."
          ssh $SSH_OPTS "${EC2_USER}@${EC2_HOST}" 'bash -s' << 'REMOTE_EOF'
            set -euo pipefail
            RELEASE_DIR=/opt/enterpriseconnect/release-gateway

            echo ">>> Extracting into clean release dir (no stale files)..."
            sudo rm -rf "$RELEASE_DIR"
            sudo mkdir -p "$RELEASE_DIR"
            sudo tar -xzf /tmp/gateway.tar.gz -C "$RELEASE_DIR"
            rm -f /tmp/gateway.tar.gz

            echo ">>> Installing protected .env file..."
            sudo mkdir -p /opt/enterpriseconnect/gateway
            sudo mv /tmp/gateway.env /opt/enterpriseconnect/gateway/.env
            sudo chown root:root /opt/enterpriseconnect/gateway/.env
            sudo chmod 600 /opt/enterpriseconnect/gateway/.env

            echo ">>> Building Docker image..."
            cd "$RELEASE_DIR"
            sudo docker build -f EnterpriseConnect.ApiGateway/Dockerfile -t enterpriseconnect-gateway:latest .

            echo ">>> Restarting container (127.0.0.1:8080 behind Nginx)..."
            sudo docker rm -f enterpriseconnect-api-gateway 2>/dev/null || true
            sudo docker run -d \
              --name enterpriseconnect-api-gateway \
              --restart unless-stopped \
              -p 127.0.0.1:8080:8080 \
              --env-file /opt/enterpriseconnect/gateway/.env \
              enterpriseconnect-gateway:latest

            echo ">>> Smoke test (retry up to 60s)..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/health/live > /dev/null; then
                echo "Gateway healthy after ${i} attempt(s)."
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "::error::Gateway did not become healthy. Container logs:"
                sudo docker logs --tail 80 enterpriseconnect-api-gateway || true
                exit 1
              fi
              sleep 2
            done

            echo ">>> Downstream routing check (informational)..."
            for svc in identity messaging media remote admin; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://127.0.0.1:8080/${svc}/health/live" || echo "000")
              echo "  - ${svc}: HTTP ${code}"
            done

            sudo docker image prune -f > /dev/null 2>&1 || true
            echo "Deployment to AWS EC2 completed successfully!"
          REMOTE_EOF
